<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyServer Lite</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="card">

        <h1>🖥️ MyServer Lite</h1>

        <p>Personal Ubuntu Dashboard</p>

        <div class="status">
            <span>🟢 Server</span>
            <strong>Online</strong>
        </div>

        <div class="status">
            <span>🐧 Ubuntu</span>
            <strong>25.10</strong>
        </div>

        <div class="status">
            <span>🐳 Docker</span>
            <strong>Running</strong>
        </div>

        <div class="status">
            <span>🕒 Time</span>
            <strong id="clock">00:00:00</strong>
        </div>

        <button id="themeBtn">
            🌙 تغییر تم
        </button>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
