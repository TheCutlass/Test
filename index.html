<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyServer Lite</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="background"></div>

    <main class="card">

        <h1>🖥️ MyServer Lite</h1>

        <p class="subtitle">
            Personal Ubuntu Dashboard
        </p>

        <section class="info">

            <div class="box">
                <span>🟢 Server</span>
                <strong>Online</strong>
            </div>

            <div class="box">
                <span>🐧 Ubuntu</span>
                <strong>25.10</strong>
            </div>

            <div class="box">
                <span>🐳 Docker</span>
                <strong>Running</strong>
            </div>

            <div class="box">
                <span>🕒 Time</span>
                <strong id="clock">00:00:00</strong>
            </div>

            <div class="box">
                <span>🌐 Browser</span>
                <strong id="browser">Loading...</strong>
            </div>

            <div class="box">
                <span>📺 Screen</span>
                <strong id="screenSize">Loading...</strong>
            </div>

        </section>

        <section class="commands">

            <h2>Quick Commands</h2>

            <div class="command">

                <code id="cmd1">sudo apt update</code>

                <button onclick="copyCommand('cmd1')">
                    📋
                </button>

            </div>

            <div class="command">

                <code id="cmd2">docker ps</code>

                <button onclick="copyCommand('cmd2')">
                    📋
                </button>

            </div>

            <div class="command">

                <code id="cmd3">df -h</code>

                <button onclick="copyCommand('cmd3')">
                    📋
                </button>

            </div>

        </section>

        <button id="themeBtn">
            🌙 Toggle Theme
        </button>

    </main>

    <script src="app.js"></script>

</body>

</html>
